name: Full CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m pytest -q
      - name: humanitarian-contract (docs/fixes.md stabilization)
        run: >-
          python -m pytest -q
          tests/test_stabilization_smoke.py
          tests/test_auto_drift_eligibility.py
          tests/test_location_evidence.py
          tests/test_live_compartments.py
          tests/test_live_taxonomy.py
          tests/test_alembic_migrations.py
          tests/test_intel_canonical_columns.py
      - name: db migrations apply cleanly
        run: python -m alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:////tmp/ci_migrations.db
      - name: ruff critical correctness gate
        run: python -m ruff check . --output-format=github
        working-directory: apps/api
      - name: ruff full baseline (report-only)
        run: python -m ruff check . --select E4,E7,E9,F --output-format=github
        working-directory: apps/api
        continue-on-error: true
      - name: mypy canonical Live domain gate
        run: >-
          python -m mypy
          core/domain/live_contracts.py
          core/live/projection.py
          core/intel/public_policy.py
          core/intel/public_geometry.py
          --follow-imports=skip
        working-directory: apps/api
      - name: mypy full baseline (report-only)
        run: python -m mypy core
        working-directory: apps/api
        continue-on-error: true
      - name: audit declared Python project dependencies
        run: python -m pip_audit . --strict
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: ESLint full baseline (report-only)
        run: npm run lint:js:full
        continue-on-error: true
      - run: npm test
      - run: npm run build:unified
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  browser-e2e:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  browser-production-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: browser-e2e
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run
      - run: npm audit --omit=dev --audit-level=high

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: reject whitespace errors in the committed change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$PUSH_BASE"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          git diff --check "$base" HEAD
      - name: reject new direct outbound HTTP bypasses
        run: python scripts/check_outbound_http_bypasses.py
      - name: scan committed history for secrets
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
